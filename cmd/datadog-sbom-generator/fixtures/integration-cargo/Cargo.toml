[package]
name = "integration-test-project"
version = "0.1.0"
edition = "2021"

[lib]

# Regular runtime dependencies
[dependencies]
serde = "1.0.214"
serde_json = "1.0.132"
tokio = { version = "1.43.0", features = ["full"] }
anyhow = "1.0.93"

# Development dependencies (for tests, examples, etc.)
[dev-dependencies]
criterion = "0.5.1"
mockall = "0.13.1"

# Build-time dependencies (for build scripts)
[build-dependencies]
cc = "1.2.5"
pkg-config = "0.3.31"
