[package]
name = "integration-test-project"
version = "0.1.0"
edition = "2021"

[lib]

# Regular runtime dependencies
[dependencies]
# Simple string form - demonstrates bare version requirement
serde = "1.0"
serde_json = "1.0.132"
# Table form with features
tokio = { version = "1.43.0", features = ["full"] }
anyhow = "1.0.93"

# Development dependencies (for tests, examples, etc.)
[dev-dependencies]
criterion = "0.5.1"
mockall = "0.13.1"
# Different version of serde for dev - demonstrates multi-version support
serde = "0.9"

# Build-time dependencies (for build scripts)
[build-dependencies]
cc = "1.2.5"
# Table form for build dependency
pkg-config = { version = "0.3.31" }
